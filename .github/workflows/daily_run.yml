name: Daily Market Data Fetch

on:
  schedule:
    # ⚙️ 00:43 UTC = 08:43 AM 香港時間 | 2-6 代表週二至週六
    - cron: '43 0 * * 2-6'
  workflow_dispatch: # 保留這個按鈕，讓你可以隨時手動點擊執行

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions: # 🛡️ 確保自動執行時 git push 不會因為權限問題變紅叉
      contents: write
    steps:
    - name: 複製專案程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 安裝 pip 套件 (這裡就是執行 pip install)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 執行爬蟲程式並產生 CSV
      env:
        # 🔑 把 GitHub 的保險箱密碼，變成 Python 看得見的系統變數
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      run: python scanner.py

    - name: 將產生的 CSV 檔案自動存回 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # ⚙️ 這裡改成指定追蹤這個固定的歷史歷史總表
        git add my_holdings_history.csv
        git commit -m "自動追加每日美股數據歷史: $(date +'%Y-%m-%d')" || exit 0
        git push
